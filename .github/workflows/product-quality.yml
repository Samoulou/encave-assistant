name: Product quality
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_product:
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'src/**', 'migrations/**', 'ops/**', 'compose*.yml', 'compose*.yaml', 'tests/**', 'evals/**', 'scripts/**', 'package*.json', '.nvmrc', '*config*', '.agentic/**', '.github/workflows/**']
  pull_request:
    paths: ['apps/**', 'packages/**', 'src/**', 'migrations/**', 'ops/**', 'compose*.yml', 'compose*.yaml', 'tests/**', 'evals/**', 'scripts/**', 'package*.json', '.nvmrc', '*config*', '.agentic/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - id: scope
        run: python3 scripts/ci_scope.py --event "$CI_EVENT"
        env:
          # workflow_call may retain the caller push event. Force all gates for release.yml.
          CI_EVENT: ${{ inputs.force_product && 'workflow_call' || github.event_name }}
  product:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: npm ci
      - run: python3 scripts/check_kit.py
      # Préparer ici DB, navigateur et connecteurs TEST autorisés après choix de stack.
      # Aucun secret OpenAI dans l'environnement global d'un job exécutant le dépôt.
      - run: python3 scripts/product_quality.py
