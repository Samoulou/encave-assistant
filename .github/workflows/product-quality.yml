name: Product quality
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_product:
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'src/**', 'migrations/**', 'ops/**', 'compose*.yml', 'compose*.yaml', 'tests/**', 'evals/**', 'scripts/**', 'package*.json', 'requirements-tooling.txt', '.nvmrc', '*config*', '.agentic/**', '.github/workflows/**']
  pull_request:
    paths: ['apps/**', 'packages/**', 'src/**', 'migrations/**', 'ops/**', 'compose*.yml', 'compose*.yaml', 'tests/**', 'evals/**', 'scripts/**', 'package*.json', 'requirements-tooling.txt', '.nvmrc', '*config*', '.agentic/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      gates: ${{ steps.scope.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - id: scope
        run: python3 scripts/ci_scope.py --event "$CI_EVENT"
        env:
          # workflow_call may retain the caller push event. Force all gates for release.yml.
          CI_EVENT: ${{ inputs.force_product && 'workflow_call' || github.event_name }}
  product:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - run: python3 -m pip install -r requirements-tooling.txt
      - run: npm ci
      - run: npm run check:environments
      - run: npm run ci:prepare
        env:
          ENCAVE_RUNTIME_ENVIRONMENT: test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check:browser
      - run: npm run test:foundation-tooling
      - run: python3 scripts/check_kit.py
      # PostgreSQL and Chromium are ready; missing product suites still fail.
      # No Microsoft/AI credentials or real provider qualification are implied.
      # Aucun secret OpenAI dans l'environnement global d'un job exécutant le dépôt.
      - run: python3 scripts/product_quality.py --gates "$QUALITY_GATES"
        env:
          QUALITY_GATES: ${{ needs.scope.outputs.gates }}
