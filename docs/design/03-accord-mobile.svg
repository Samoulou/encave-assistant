<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1000" viewBox="0 0 390 1000" role="img" aria-labelledby="title desc"><title id="title">EnCave Assistant — acceptation mobile, concept</title><desc id="desc">Page mobile d’une proposition fictive version 2 de la cave des Coteaux. Le bouton Accepter cette proposition indique explicitement qu’il ne confirme pas encore la réservation.</desc>
<style>text {font-family: Arial, sans-serif;} .num {font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="390" height="1000" rx="0" fill="#F8F6F3"/>
<rect x="0" y="0" width="390" height="94" rx="0" fill="#FFFFFF"/>
<text x="20" y="39" font-size="23" fill="#6E2944" font-weight="700">Cave des Coteaux</text>
<text x="20" y="67" font-size="14" fill="#655B62" font-weight="400">Votre proposition de dégustation</text>
<rect x="20" y="116" width="142" height="30" rx="15" fill="#F8EDF1"/>
<text x="32" y="136" font-size="13" fill="#6E2944" font-weight="600">Proposition n° 2</text>
<text x="20" y="180" font-size="27" fill="#272326" font-weight="700">Un moment à la cave</text>
<text x="20" y="212" font-size="16" fill="#655B62" font-weight="400">Bonjour Claire, voici les termes de</text>
<text x="20" y="237" font-size="16" fill="#655B62" font-weight="400">notre proposition pour votre groupe.</text>
<rect x="20" y="264" width="350" height="344" rx="12" fill="#FFFFFF"/>
<text x="36" y="300" font-size="20" fill="#6E2944" font-weight="600">Dégustation découverte</text>
<text x="36" y="337" font-size="12" fill="#655B62" font-weight="400">Date</text>
<text x="36" y="361" font-size="16" fill="#272326" font-weight="400">Samedi 17 octobre 2026</text>
<text x="36" y="389" font-size="12" fill="#655B62" font-weight="400">Heure</text>
<text x="36" y="413" font-size="16" fill="#272326" font-weight="400">15:00–16:30 · Europe/Zurich</text>
<text x="36" y="441" font-size="12" fill="#655B62" font-weight="400">Votre groupe</text>
<text x="36" y="465" font-size="16" fill="#272326" font-weight="400">12 personnes</text>
<text x="36" y="493" font-size="12" fill="#655B62" font-weight="400">Prix</text>
<text x="36" y="517" font-size="16" fill="#272326" font-weight="400">12 × 35.00 CHF</text>
<path d="M 36 546 h 318" stroke="#DDD5D7"/>
<text x="36" y="573" font-size="14" fill="#272326" font-weight="400">Total, taxes incluses</text>
<text x="260" y="576" font-size="20" fill="#272326" font-weight="700">420 CHF</text>
<text x="20" y="643" font-size="17" fill="#272326" font-weight="600">Conditions de cette proposition</text>
<text x="20" y="673" font-size="14" fill="#655B62" font-weight="400">Valable jusqu’au 15 septembre à 18:00.</text>
<text x="20" y="696" font-size="14" fill="#655B62" font-weight="400">Les conditions complètes sont accessibles</text>
<text x="20" y="719" font-size="14" fill="#655B62" font-weight="400">avant votre accord.</text>
<text x="20" y="751" font-size="14" fill="#6E2944" font-weight="600">Lire les conditions de la version 2</text>
<rect x="20" y="775" width="350" height="80" rx="8" fill="#EAF3FA"/>
<text x="36" y="800" font-size="14" fill="#235D80" font-weight="400">Votre accord sera transmis à la cave.</text>
<text x="36" y="821" font-size="14" fill="#235D80" font-weight="400">La réservation sera confirmée ensuite,</text>
<text x="36" y="842" font-size="14" fill="#235D80" font-weight="400">après validation du créneau.</text>
<rect x="20" y="875" width="350" height="44" rx="8" fill="#6E2944"/>
<text x="36" y="903" font-size="14" fill="#FFFFFF" font-weight="600">Accepter cette proposition</text>
<text x="66" y="945" font-size="14" fill="#6E2944" font-weight="600">Demander une modification</text>
<text x="20" y="983" font-size="11" fill="#655B62" font-weight="400">CONCEPT · Données fictives · Sans compte client</text>
</svg>
